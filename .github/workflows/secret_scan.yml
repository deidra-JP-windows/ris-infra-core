name: Secret Scan

on:
  pull_request:
    branches: [develop]

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep for AWS keys and password-like strings
        working-directory: riften_web_infra/terraform
        run: |
          set -e
          echo "AWS のシークレットキーらしき文字列をスキャン中..."
          if grep -rE 'AKIA[0-9A-Z]{16}' .; then
            echo "Error: AWSシークレットキーの漏洩が検出されました。コミットを修正してください。"
            exit 1
          else
            echo "OK: AWSシークレットキーの漏洩は検出されませんでした。"
          fi
